name: Verificar Mineralchemy

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Conferir páginas geradas
        run: npm run check:generated
      - name: Executar testes do motor e dos dados
        run: npm test
      - name: Instalar Chromium e dependências de sistema
        run: npx playwright install --with-deps --only-shell chromium
      - name: Executar testes de navegador
        run: npm run test:browser
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: failure()
        with:
          name: resultados-do-navegador
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
