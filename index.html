/* Registro de reações organizado com categorias e progresso sem revelar receitas ocultas. */
.history-dialog{width:min(940px,100%)}
.history-intro{margin:3px 0 14px!important;color:#788a80!important;font-size:12px!important;line-height:1.6!important}
.history-filters{display:flex;flex-wrap:wrap;gap:7px;margin:14px 0 14px}
.history-filter{display:flex;align-items:center;gap:9px;background:#fbfcfb;border:1px solid #e5ece7;color:#506357;border-radius:11px;font-size:11px;font-weight:700;padding:9px 11px;white-space:nowrap}
.history-filter b{color:#7d9386;font-variant-numeric:tabular-nums;font-size:10px;font-weight:740}
.history-filter.selected{background:#eaf5ed;border-color:#cde7d5;color:#207148}
.history-filter.selected b{color:#2c8356}
.history-search{margin:0 0 15px;height:41px}
.history-results{display:flex;flex-direction:column;gap:24px}
.history-section{border-top:1px solid #ecf0ed;padding-top:21px}
.history-section:first-child{border-top:0;padding-top:0}
.history-section-head{display:flex;justify-content:space-between;align-items:flex-start;gap:15px;padding-bottom:13px}
.history-section-head h3{color:#30483a;font-size:16px;font-weight:760;letter-spacing:-.45px;margin:0}
.history-section-head p{font-size:11px!important;line-height:1.45!important;color:#88978d!important;margin:5px 0 0!important}
.history-section-head>span{border-radius:999px;border:1px solid #dcecdf;background:#f1f8f3;padding:5px 9px;color:#4e8b64;font-size:11px;font-variant-numeric:tabular-nums;font-weight:740;white-space:nowrap}
.history-section .reaction-list{margin-top:0}
.history-section-empty{margin:0!important;padding:14px 12px!important;background:#f9fbfa;border:1px dashed #e6ebe8;border-radius:11px;font-size:11px!important;text-align:center;color:#9aa8a0!important}
@media(max-width:680px){.history-dialog{padding:23px 19px}.history-filters{gap:6px}.history-filter{padding:8px 9px;gap:7px;font-size:10px}.history-filter b{font-size:10px}.history-search{height:36px}.history-section-head h3{font-size:15px}.history-section-head p{font-size:10px!important}}

.reaction-reference-note{font-size:10px!important;color:#8b998f!important;line-height:1.45!important;margin:4px 0 0!important}

/* Trilhas geológicas: etapas conhecidas mostram SVG, as desconhecidas preservam a descoberta. */
.paths-dialog{width:min(940px,100%)}
.paths-intro{font-size:12px!important;color:#78877d!important;line-height:1.6!important}
.paths-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px;margin-top:19px}
.path-track{background:#fbfcfb;border:1px solid #e6eee8;border-radius:17px;padding:18px 16px;min-width:0}
.path-track h3{margin:0 0 6px;color:#324a3c;font-size:15px;letter-spacing:-.35px}
.path-track>p{margin:0 0 12px!important;font-size:11px!important;line-height:1.5!important;color:#85968b!important}
.path-list{display:flex;flex-direction:column;align-items:center;gap:2px}
.path-node{display:flex;align-items:center;gap:9px;width:min(100%,250px);background:white;border:1px solid #e5ece7;border-radius:11px;padding:7px 9px;color:#395342;font-size:11px;font-weight:690;text-align:left}
.path-node-icon{display:grid;place-items:center;width:31px;height:31px;border-radius:50%;background:var(--orb);border:1px solid var(--ring);color:var(--ink);font-size:16px;flex:none}
.path-node-icon .mineral-art{width:25px;height:25px;max-width:85%;max-height:85%}
.path-node-locked{color:#a5b3aa;background:#f4f7f5;border-style:dashed}
.path-node-locked .path-node-icon{background:#e7eee9;border-color:#e2e9e4}
.path-step{display:flex;flex-direction:column;align-items:center;gap:1px;padding:3px 0;color:#7b9884;font-size:13px}
.path-step small{font-size:10px;font-weight:600;color:#849689;text-align:center}
@media(max-width:680px){.paths-grid{grid-template-columns:1fr;gap:10px}.path-track{padding:15px 13px}.paths-dialog{padding:23px 19px}.paths-trigger{padding:0 8px}}

/* Atalhos, coleção com memória e ilustrações de agentes */
.library-section-label{grid-column:1/-1;padding:3px 8px 4px;font-size:10px;color:#829688;text-transform:uppercase;letter-spacing:.06em;font-weight:780}
.agent-svg{display:block;width:27px;height:27px;stroke:currentColor;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-width:1.8}
.piece-orb .agent-svg{width:33px;height:33px}.library-orb .agent-svg{width:25px;height:25px}
.board-react{background:#e9f6ee;border-color:#cce5d4;color:#247c52}.board-react:hover{background:#def0e4}
.shortcut-guide{margin-top:10px;background:#f5f8f6;padding:11px;border-radius:10px;font-size:12px;line-height:1.7;color:#546d5b}
.shortcut-guide kbd{border:1px solid #d5e6da;background:#fff;border-radius:4px;padding:1px 5px;color:#275a40;font:700 11px ui-monospace,monospace}
@media(max-width:680px){.library-section-label{padding:3px 6px}.filters{flex-wrap:wrap}.filters button{flex:1 1 auto}}

/* Agrupamento do histórico de reações */
.history-grouping{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:0 0 15px}
.history-grouping-label{font-size:11px;font-weight:700;color:#788a80;margin-right:3px}
.history-group-button{border:1px solid #e5ece7;background:#fbfcfb;border-radius:10px;padding:8px 11px;font-size:11px;font-weight:700;color:#506357}
.history-group-button.selected{background:#eaf5ed;border-color:#cde7d5;color:#207148}

om água, condições apropriadas de temperatura, atividade da sílica e fluido.","source":"https://www.frontiersin.org/journals/geochemistry/articles/10.3389/fgeoc.2026.1913188/full","symbolic":false},{"id":"a-forsterite-carbon","kind":"alteration","inputs":["forsterite"],"outputs":["magnesite","quartz"],"agent":"co2","equation":"Mg₂SiO₄ + 2 CO₂ → 2 MgCO₃ + SiO₂","summary":"Carbonatação de forsterita; forma um carbonato e sílica.","conditions":"Pressão parcial de CO₂, temperatura e disponibilidade de fluido adequadas.","source":"https://link.springer.com/article/10.1186/s42834-022-00155-6","symbolic":false},{"id":"a-woll-carbon","kind":"alteration","inputs":["wollastonite"],"outputs":["calcite","quartz"],"agent":"co2","equation":"CaSiO₃ + CO₂ → CaCO₃ + SiO₂","summary":"Carbonatação de wollastonita.","conditions":"Disponibilidade de CO₂ e cinética favorável.","source":"https://link.springer.com/article/10.1186/s42834-022-00155-6","symbolic":false},{"id":"a-brucite-carbon","kind":"alteration","inputs":["brucite"],"outputs":["magnesite","water"],"agent":"co2","equation":"Mg(OH)₂ + CO₂ → MgCO₃ + H₂O","summary":"Carbonatação de brucita.","conditions":"CO₂ e condições de reação adequadas.","source":"https://link.springer.com/article/10.1186/s42834-022-00155-6","symbolic":false},{"id":"a-lizardite-carbon","kind":"alteration","inputs":["lizardite"],"outputs":["magnesite","quartz","water"],"agent":"co2","equation":"Mg₃Si₂O₅(OH)₄ + 3 CO₂ → 3 MgCO₃ + 2 SiO₂ + 2 H₂O","summary":"Carbonatação simplificada de mineral do grupo da serpentina.","conditions":"Reação idealizada; pode envolver sílica amorfa e espécies dissolvidas.","source":"https://link.springer.com/article/10.1186/s42834-022-00155-6","symbolic":false},{"id":"a-pyrite-air","kind":"alteration","inputs":["pyrite"],"outputs":["goethite","sulfate","proton"],"agent":"air","equation":"4 FeS₂ + 15 O₂ + 10 H₂O → 4 FeOOH + 8 SO₄²⁻ + 16 H⁺","summary":"Oxidação de pirita: formam-se goethita, sulfato e acidez.","conditions":"Exposição prolongada a ar e água; sequência geoquímica global.","source":"https://www.mdpi.com/2227-9717/8/4/409/htm","symbolic":false},{"id":"a-orthoclase-rain","kind":"alteration","inputs":["orthoclase"],"outputs":["kaolinite","potassium_ion","silicic_acid"],"agent":"rain","equation":"2 KAlSi₃O₈ + 2 H⁺ + 9 H₂O → Al₂Si₂O₅(OH)₄ + 2 K⁺ + 4 H₄SiO₄","summary":"Hidrólise ácida de feldspato potássico em caulinita.","conditions":"Água ácida, lixiviação e condições geoquímicas favoráveis.","source":"https://www.geo.fu-berlin.de/en/v/geolearning/mountain_building/weathering/weathering3/index.html","symbolic":false},{"id":"a-kaolinite-rain","kind":"alteration","inputs":["kaolinite"],"outputs":["gibbsite","silicic_acid"],"agent":"rain","equation":"Al₂Si₂O₅(OH)₄ + 5 H₂O → 2 Al(OH)₃ + 2 H₄SiO₄","summary":"Dessilicificação avançada de caulinita, produzindo gibbsita.","conditions":"Intemperismo intenso, com forte lixiviação de sílica.","source":"https://www.sciencedirect.com/science/article/abs/pii/S0009254111000076","symbolic":false},{"id":"a-anhydrite-water","kind":"alteration","inputs":["anhydrite"],"outputs":["gypsum"],"agent":"water","equation":"CaSO₄ + 2 H₂O → CaSO₄·2H₂O","summary":"Hidratação de anidrita formando gipsita.","conditions":"Água disponível e condições favoráveis à hidratação.","source":"https://www.britannica.com/science/gypsum","symbolic":false},{"id":"a-gypsum-heat","kind":"alteration","inputs":["gypsum"],"outputs":["anhydrite","water"],"agent":"heat","equation":"CaSO₄·2H₂O → CaSO₄ + 2 H₂O","summary":"Desidratação global da gipsita.","conditions":"Aquecimento suficiente; podem ocorrer fases intermediárias.","source":"https://www.britannica.com/science/gypsum","symbolic":false},{"id":"a-calcite-rain","kind":"alteration","inputs":["calcite"],"outputs":["calcium_ion","bicarbonate"],"agent":"rain","equation":"CaCO₃ + CO₂ + H₂O → Ca²⁺ + 2 HCO₃⁻","summary":"Dissolução de calcita em água contendo CO₂.","conditions":"Água com CO₂ dissolvido e subsaturação em calcita.","source":"https://www.geo.fu-berlin.de/en/v/geolearning/mountain_building/weathering/weathering3/index.html","symbolic":false},{"id":"a-calcite-heat","kind":"alteration","inputs":["calcite"],"outputs":["lime","co2"],"agent":"heat","equation":"CaCO₃ → CaO + CO₂","summary":"Decomposição térmica de calcita.","conditions":"Altas temperaturas e condições adequadas de pressão de CO₂.","source":"https://www.britannica.com/science/calcium-oxide","symbolic":false},{"id":"a-magnesite-heat","kind":"alteration","inputs":["magnesite"],"outputs":["periclase","co2"],"agent":"heat","equation":"MgCO₃ → MgO + CO₂","summary":"Decomposição térmica de magnesita.","conditions":"Aquecimento suficiente.","source":"https://www.britannica.com/science/magnesite","symbolic":false},{"id":"a-portlandite-co2","kind":"alteration","inputs":["portlandite"],"outputs":["calcite","water"],"agent":"co2","equation":"Ca(OH)₂ + CO₂ → CaCO₃ + H₂O","summary":"Carbonatação da portlandita.","conditions":"Contato com CO₂ atmosférico ou dissolvido.","source":"https://www.britannica.com/science/calcium-hydroxide","symbolic":false},{"id":"a-goethite-heat","kind":"alteration","inputs":["goethite"],"outputs":["hematite","water"],"agent":"heat","equation":"2 FeOOH → Fe₂O₃ + H₂O","summary":"Desidroxilação de goethita.","conditions":"Aquecimento suficiente.","source":"https://www.britannica.com/science/goethite","symbolic":false},{"id":"a-cuprite-rain","kind":"alteration","inputs":["cuprite"],"outputs":["malachite"],"agent":"rain","equation":"2 Cu₂O + 2 CO₂ + O₂ + 2 H₂O → 2 Cu₂CO₃(OH)₂","summary":"Formação simplificada de malaquita na alteração oxidante de cobre.","conditions":"Presença de água, O₂, CO₂ e atividade de espécies em solução apropriadas.","source":"https://www.britannica.com/science/malachite","symbolic":false},{"id":"a-lime-water","kind":"alteration","inputs":["lime"],"outputs":["portlandite"],"agent":"water","equation":"CaO + H₂O → Ca(OH)₂","summary":"Hidratação da cal.","conditions":"Contato com água.","source":"https://www.britannica.com/science/calcium-hydroxide","symbolic":false},{"id":"a-portlandite-heat","kind":"alteration","inputs":["portlandite"],"outputs":["lime","water"],"agent":"heat","equation":"Ca(OH)₂ → CaO + H₂O","summary":"Desidroxilação térmica da portlandita.","conditions":"Aquecimento suficiente.","source":"https://www.britannica.com/science/calcium-hydroxide","symbolic":false},{"id":"s-chalcopyrite","kind":"synthesis","inputs":["pyrite","cu"],"outputs":["chalcopyrite"],"agent":null,"equation":"FeS₂ + Cu → CuFeS₂","summary":"Incorporação composicional de cobre à pirita; a calcopirita pode se formar por substituição hidrotermal.","conditions":"Representação didática. Na natureza, o Cu é transportado em solução e há transferência de elétrons e acoplamento entre dissolução e precipitação.","source":"https://www.sciencedirect.com/science/article/pii/S0016703721000405","symbolic":true},{"id":"s-ferrosilite-direct","kind":"synthesis","inputs":["quartz","fe"],"outputs":["ferrosilite"],"agent":null,"equation":"2 Fe + 2 SiO₂ + O₂ → 2 FeSiO₃","summary":"Quartzo e ferro levam à composição ideal da ferrosilita, um ortopiroxênio.","conditions":"O₂ entra como reagente ambiental adicional, não como parte do par selecionado. Formação efetiva depende de temperatura, pressão e atividade de oxigênio. Rota didática.","source":"https://clays.org/wp-content/uploads/2026/05/CMS_Nomenclature_Glossary_April_2020_Part_2.htm","symbolic":true,"environmentalInputs":["o2"]},{"id":"s-ferrosilite","kind":"synthesis","inputs":["wustite","quartz"],"outputs":["ferrosilite"],"agent":null,"equation":"FeO + SiO₂ → FeSiO₃","summary":"Associação estequiométrica dos componentes FeO e SiO₂ para a composição ideal da ferrosilita.","conditions":"Cristalização idealizada; pressão, temperatura e fugacidade de oxigênio controlam fases e estabilidade.","source":"https://clays.org/wp-content/uploads/2026/05/CMS_Nomenclature_Glossary_April_2020_Part_2.htm","symbolic":true},{"id":"s-wustite","kind":"synthesis","inputs":["fe","hematite"],"outputs":["wustite"],"agent":null,"equation":"Fe + Fe₂O₃ → 3 FeO","summary":"Proporção composicional para produzir o óxido ferroso ideal.","conditions":"Requer condições de baixa fugacidade de oxigênio e temperatura suficiente; wüstita real é não estequiométrica (Fe₁₋ₓO).","source":"https://www.degruyterbrill.com/document/doi/10.1515/znb-2022-0071/html","symbolic":true},{"id":"s-enstatite-direct","kind":"synthesis","inputs":["quartz","mg"],"outputs":["enstatite"],"agent":null,"equation":"2 Mg + 2 SiO₂ + O₂ → 2 MgSiO₃","summary":"Síntese composicional intuitiva de um ortopiroxênio magnesiano.","conditions":"Rota didática que utiliza O₂ disponível no ambiente. Cristalização real depende das condições físico-químicas.","source":"https://clays.org/wp-content/uploads/2026/05/CMS_Nomenclature_Glossary_April_2020_Part_2.htm","symbolic":true,"environmentalInputs":["o2"]},{"id":"s-wollastonite-direct","kind":"synthesis","inputs":["quartz","ca"],"outputs":["wollastonite"],"agent":null,"equation":"2 Ca + 2 SiO₂ + O₂ → 2 CaSiO₃","summary":"Síntese composicional intuitiva de wollastonita, um piroxenoide (não um piroxênio).","conditions":"O₂ implícito do ambiente; representação didática da composição.","source":"https://clays.org/wp-content/uploads/2026/05/CMS_Nomenclature_Glossary_April_2020_Part_2.htm","symbolic":true,"environmentalInputs":["o2"]},{"id":"s-diopside","kind":"synthesis","inputs":["enstatite","wollastonite"],"outputs":["diopside"],"agent":null,"equation":"MgSiO₃ + CaSiO₃ → CaMgSi₂O₆","summary":"Composição ideal do diopsídio, um clinopiroxênio cálcico-magnesiano.","conditions":"Mistura estequiométrica de componentes, não uma reação única garantida em condições geológicas.","source":"https://clays.org/wp-content/uploads/2026/05/CMS_Nomenclature_Glossary_April_2020_Part_2.htm","symbolic":true},{"id":"s-hedenbergite","kind":"synthesis","inputs":["ferrosilite","wollastonite"],"outputs":["hedenbergite"],"agent":null,"equation":"FeSiO₃ + CaSiO₃ → CaFeSi₂O₆","summary":"Composição ideal da hedenbergita, clinopiroxênio cálcico-ferroso.","conditions":"Rota composicional idealizada, dependente das condições de estabilidade.","source":"https://clays.org/wp-content/uploads/2026/05/CMS_Nomenclature_Glossary_April_2020_Part_2.htm","symbolic":true},{"id":"s-fayalite","kind":"synthesis","inputs":["ferrosilite","wustite"],"outputs":["fayalite"],"agent":null,"equation":"FeSiO₃ + FeO → Fe₂SiO₄","summary":"Composição ideal da faialita, extremo ferroso das olivinas.","conditions":"Mistura estequiométrica idealizada; sua cristalização depende de pressão, temperatura e oxigênio.","source":"https://clays.org/wp-content/uploads/2026/05/CMS_Nomenclature_Glossary_April_2020_Part_2.htm","symbolic":true},{"id":"e-forsterite-fe","kind":"synthesis","inputs":["forsterite","fe"],"outputs":["olivine"],"agent":null,"equation":"Forsterita + Fe → Olivina (intermediária)","summary":"O ferro desloca a composição da olivina em direção ao polo rico em Fe.","conditions":"Trilha de composição didática. Reorganização catiônica real depende de trocas, balanço de matéria e equilíbrio.","source":"https://mineralogy-ima.org/docs/IMA-Nomenclature-e-Booklet-2019.pdf","symbolic":true,"mechanic":"evolution"},{"id":"e-olivine-fe","kind":"synthesis","inputs":["olivine","fe"],"outputs":["fayalite"],"agent":null,"equation":"Olivina + Fe → Faialita","summary":"Com mais ferro, a olivina chega ao membro extremo rico em Fe.","conditions":"Atalho didático para representar enriquecimento progressivo em Fe na solução sólida.","source":"https://mineralogy-ima.org/docs/IMA-Nomenclature-e-Booklet-2019.pdf","symbolic":true,"mechanic":"evolution"},{"id":"e-olivine-mg","kind":"synthesis","inputs":["olivine","mg"],"outputs":["forsterite"],"agent":null,"equation":"Olivina + Mg → Forsterita","summary":"O magnésio desloca a série da olivina em direção à forsterita.","conditions":"Atalho didático para representar mudança composicional. Não é uma equação química.","source":"https://mineralogy-ima.org/docs/IMA-Nomenclature-e-Booklet-2019.pdf","symbolic":true,"mechanic":"evolution"},{"id":"e-enstatite-ca","kind":"synthesis","inputs":["enstatite","ca"],"outputs":["diopside"],"agent":null,"equation":"2 MgSiO₃ + 2 Ca + 2 SiO₂ + O₂ → 2 CaMgSi₂O₆","summary":"Com cálcio disponível, a enstatita conduz à descoberta de um clinopiroxênio cálcico: diopsídio.","conditions":"O meio disponibiliza sílica e oxigênio. A reação é uma simplificação estequiométrica, não uma cristalização imediata.","source":"https://mineralogy-ima.org/docs/IMA-Nomenclature-e-Booklet-2019.pdf","symbolic":true,"environmentalInputs":["quartz","o2"]},{"id":"e-diopside-fe","kind":"synthesis","inputs":["diopside","fe"],"outputs":["augite"],"agent":null,"equation":"Diopsídio + Fe → Augita","summary":"O enriquecimento em ferro conduz à augita, etapa intermediária do percurso didático de clinopiroxênios.","conditions":"A augita possui uma faixa composicional complexa, não apenas um teor intermediário de Fe.","source":"https://mineralogy-ima.org/docs/IMA-Nomenclature-e-Booklet-2019.pdf","symbolic":true,"mechanic":"evolution"},{"id":"e-augite-fe","kind":"synthesis","inputs":["augite","fe"],"outputs":["hedenbergite"],"agent":null,"equation":"Augita + Fe → Hedenbergita","summary":"Mais ferro leva ao polo da hedenbergita na progressão simplificada.","conditions":"Evolução didática: a augita não é obrigatoriamente uma composição intermediária real entre esses extremos.","source":"https://mineralogy-ima.org/docs/IMA-Nomenclature-e-Booklet-2019.pdf","symbolic":true,"mechanic":"evolution"},{"id":"e-hedenbergite-mg","kind":"synthesis","inputs":["hedenbergite","mg"],"outputs":["augite"],"agent":null,"equation":"Hedenbergita + Mg → Augita","summary":"Adicionar magnésio retorna a uma composição intermediária no caminho didático.","conditions":"Trilha didática de substituição Mg–Fe.","source":"https://mineralogy-ima.org/docs/IMA-Nomenclature-e-Booklet-2019.pdf","symbolic":true,"mechanic":"evolution"},{"id":"e-augite-mg","kind":"synthesis","inputs":["augite","mg"],"outputs":["diopside"],"agent":null,"equation":"Augita + Mg → Diopsídio","summary":"Adicionar magnésio conduz em direção à composição do diopsídio.","conditions":"Trilha didática de substituição Mg–Fe.","source":"https://mineralogy-ima.org/docs/IMA-Nomenclature-e-Booklet-2019.pdf","symbolic":true,"mechanic":"evolution"},{"id":"s-brucite-water","kind":"synthesis","inputs":["periclase","water"],"outputs":["brucite"],"agent":null,"equation":"MgO + H₂O → Mg(OH)₂","summary":"A água incorpora OH à nova fase, formando brucita.","conditions":"Hidratação de um óxido de magnésio; simplificação de uma reação global.","source":"https://geo.libretexts.org/Bookshelves/Geology/Mineralogy_(Perkins_et_al.)/14%3A_Mineral_Descriptions","symbolic":false},{"id":"s-serpentine-water","kind":"synthesis","inputs":["forsterite","water"],"outputs":["lizardite","brucite"],"agent":null,"equation":"2 Mg₂SiO₄ + 3 H₂O → Mg₃Si₂O₅(OH)₄ + Mg(OH)₂","summary":"A água forma grupos OH em serpentina e brucita a partir de forsterita.","conditions":"Modelo global de serpentinização, que depende de fluidos e condições adequadas.","source":"https://publications.iodp.org/proceedings/304_305/103/103_3.htm","symbolic":false},{"id":"s-olivine-water","kind":"synthesis","inputs":["olivine","water"],"outputs":["lizardite","brucite"],"agent":null,"equation":"Olivina + Água → Serpentina + Brucita","summary":"Na trilha didática, a água transforma olivina em fases portadoras de OH.","conditions":"O produto real de olivina com Fe pode envolver magnetita e outras fases; esta é uma associação simplificada.","source":"https://publications.iodp.org/proceedings/304_305/103/103_3.htm","symbolic":true,"mechanic":"evolution"},{"id":"s-enstatite-water","kind":"synthesis","inputs":["enstatite","water"],"outputs":["lizardite","talc"],"agent":null,"equation":"6 MgSiO₃ + 3 H₂O → Mg₃Si₂O₅(OH)₄ + Mg₃Si₄O₁₀(OH)₂","summary":"A hidratação de enstatita pode formar serpentina e talco, dois minerais com OH.","conditions":"Representação de reação global hidratante em sistemas magnesianos.","source":"https://home.ifa.hawaii.edu/users/meech/a740/2004/fall/ppt/A734_Mottl110804.pdf","symbolic":false},{"id":"s-diopside-water","kind":"synthesis","inputs":["diopside","water"],"outputs":["tremolite"],"agent":null,"equation":"2 CaMgSi₂O₆ + 3 MgSiO₃ + SiO₂ + H₂O → Ca₂Mg₅Si₈O₂₂(OH)₂","summary":"Água e componentes ambientais permitem formar tremolita, um anfibólio com OH.","conditions":"Requer também magnésio e sílica do meio: não é apenas a adição direta de água ao diopsídio.","source":"https://geo.libretexts.org/Bookshelves/Geology/Mineralogy_%28Perkins_et_al.%29/14%3A_Mineral_Descriptions/14.01%3A_Silicate_Class/14.1.03%3A_Silicate_Class_-_Chain_Silicates","symbolic":true,"environmentalInputs":["enstatite","quartz"]},{"id":"s-anhydrite-water","kind":"synthesis","inputs":["anhydrite","water"],"outputs":["gypsum"],"agent":null,"equation":"CaSO₄ + 2 H₂O → CaSO₄·2H₂O","summary":"A gipsita incorpora moléculas de H₂O à estrutura, sem criar grupos OH na fórmula.","conditions":"Hidratação com água de cristalização, distinta de formação de hidroxilas.","source":"https://geo.libretexts.org/Bookshelves/Geology/Mineralogy_(Perkins_et_al.)/14%3A_Mineral_Descriptions","symbolic":false},{"id":"a-periclase-water","kind":"alteration","inputs":["periclase"],"outputs":["brucite"],"agent":"water","equation":"MgO + H₂O → Mg(OH)₂","summary":"Formação de OH em brucita.","conditions":"Hidratação.","source":"https://geo.libretexts.org/Bookshelves/Geology/Mineralogy_(Perkins_et_al.)/14%3A_Mineral_Descriptions","symbolic":false},{"id":"a-hematite-water","kind":"alteration","inputs":["hematite"],"outputs":["goethite"],"agent":"water","equation":"Fe₂O₃ + H₂O → 2 FeOOH","summary":"A fase hidratada contém hidroxila estrutural. Nesta rota, a água é usada para representar hidratação e/ou incorporação de OH estrutural.","conditions":"Modelo global de hidratação; estabilidade depende do meio.","source":"https://geo.libretexts.org/Bookshelves/Geology/Mineralogy_(Perkins_et_al.)/14%3A_Mineral_Descriptions","symbolic":false},{"id":"a-forsterite-water","kind":"alteration","inputs":["forsterite"],"outputs":["lizardite","brucite"],"agent":"water","equation":"2 Mg₂SiO₄ + 3 H₂O → Mg₃Si₂O₅(OH)₄ + Mg(OH)₂","summary":"Hidratação com formação de grupos OH.","conditions":"Modelo simplificado de serpentinização.","source":"https://publications.iodp.org/proceedings/304_305/103/103_3.htm","symbolic":false},{"id":"a-olivine-water","kind":"alteration","inputs":["olivine"],"outputs":["lizardite","brucite"],"agent":"water","equation":"Olivina + Água → Serpentina + Brucita","summary":"Água transforma a olivina em fases ricas em OH no modelo do jogo.","conditions":"O produto real depende da proporção de Fe/Mg e das condições do fluido.","source":"https://publications.iodp.org/proceedings/304_305/103/103_3.htm","symbolic":true,"mechanic":"evolution"},{"id":"a-enstatite-water","kind":"alteration","inputs":["enstatite"],"outputs":["lizardite","talc"],"agent":"water","equation":"6 MgSiO₃ + 3 H₂O → Mg₃Si₂O₅(OH)₄ + Mg₃Si₄O₁₀(OH)₂","summary":"A água adiciona grupos OH em serpentina e talco.","conditions":"Modelo global de hidratação.","source":"https://home.ifa.hawaii.edu/users/meech/a740/2004/fall/ppt/A734_Mottl110804.pdf","symbolic":false},{"id":"a-diopside-water","kind":"alteration","inputs":["diopside"],"outputs":["tremolite"],"agent":"water","equation":"2 CaMgSi₂O₆ + 3 MgSiO₃ + SiO₂ + H₂O → Ca₂Mg₅Si₈O₂₂(OH)₂","summary":"A água participa da formação de tremolita, com OH estruturais.","conditions":"Necessita também sílica e componentes de magnésio do meio.","source":"https://geo.libretexts.org/Bookshelves/Geology/Mineralogy_%28Perkins_et_al.%29/14%3A_Mineral_Descriptions/14.01%3A_Silicate_Class/14.1.03%3A_Silicate_Class_-_Chain_Silicates","symbolic":false},{"id":"a-talc-heat","kind":"alteration","inputs":["talc"],"outputs":["enstatite","quartz","water"],"agent":"heat","equation":"Mg₃Si₄O₁₀(OH)₂ → 3 MgSiO₃ + SiO₂ + H₂O","summary":"O aquecimento remove grupos OH da estrutura do talco e devolve água ao meio.","conditions":"Desidroxilação global simplificada; a sequência real de fases depende da temperatura e da pressão.","source":"https://home.ifa.hawaii.edu/users/meech/a740/2004/fall/ppt/A734_Mottl110804.pdf","symbolic":false},{"id":"a-brucite-heat","kind":"alteration","inputs":["brucite"],"outputs":["periclase","water"],"agent":"heat","equation":"Mg(OH)₂ → MgO + H₂O","summary":"Brucita libera água ao perder seus grupos hidroxila com o aquecimento.","conditions":"Desidroxilação global simplificada.","source":"https://geo.libretexts.org/Bookshelves/Geology/Mineralogy_(Perkins_et_al.)/14%3A_Mineral_Descriptions","symbolic":false},{"id":"a-tremolite-heat","kind":"alteration","inputs":["tremolite"],"outputs":["diopside","enstatite","quartz","water"],"agent":"heat","equation":"Ca₂Mg₅Si₈O₂₂(OH)₂ → 2 CaMgSi₂O₆ + 3 MgSiO₃ + SiO₂ + H₂O","summary":"O aquecimento remove OH e permite retornar a silicatos sem grupos hidroxila.","conditions":"Esquema de desidroxilação global, não uma previsão de equilíbrio metamórfico.","source":"https://geo.libretexts.org/Bookshelves/Geology/Mineralogy_%28Perkins_et_al.%29/14%3A_Mineral_Descriptions/14.01%3A_Silicate_Class/14.1.03%3A_Silicate_Class_-_Chain_Silicates","symbolic":false},{"id":"ion-oxide-proton","kind":"synthesis","inputs":["oxide","proton"],"outputs":["hydroxide"],"agent":null,"equation":"O²⁻ + H⁺ → OH⁻","summary":"Protonação de óxido gera hidróxido.","conditions":"Modelo de componentes; óxido livre não é estável em meio aquoso.","source":"https://blogs.helsinki.fi/inorganic-kvali/water-and-hydroxide-ion/","symbolic":false},{"id":"ion-water","kind":"synthesis","inputs":["hydroxide","proton"],"outputs":["water"],"agent":null,"equation":"H⁺ + OH⁻ → H₂O","summary":"Neutralização ácido-base.","conditions":"Representação simplificada; a ocorrência natural depende do ambiente.","source"     if (allInputs.some(id => ['air', 'reduction'].includes(id)) || /(?:oxidation|oxida|reduction|redu[cç]|redox)/i.test(reaction.id))
        tags.add('redox');

function reactionReference(reaction, reactions, byCard) {
    const reference = METAMORPHIC_ROUTE_EQUATIONS[reaction.id];
    if (reference)

        return { kind: 'equation', title: 'Equação química', value: reaction.equation };
    const outputs = reaction.outputs.filter(id => byCard.get(id)?.kind === 'mineral');
    if (outputs.length === 1) {
        const output = outputs[0];

        if (phase)
            return { kind: 'process', title: 'Equivalência composicional', value: phase };
        const explicit = REFERENCE_EQUATIONS[output];
        if (explicit)
            return { kind: 'equation', title: 'Equação química de referência', value: explicit };

            && candidate.outputs.includes(output) && !candidate.id.startsWith('prepare-'));
        if (match)
            return { kind: 'equation', title: 'Equação química de referência', value: match.equation };
    }
    // Complex solid solutions/assemblages cannot be reduced to an honest unique balance.
    const formulas = outputs.map(id => byCard.get(id)?.formula).filter((f) => !!f);
    if (formulas.length)
        return { kind: 'composition', title: 'Composição dos produtos', value: formulas.join(' + ') };
    return { kind: 'process', title: 'Processo registrado', value: reaction.summary };
}

    return; const orig = active; active = null; orig.element.classList.remove('dragging', 'has-moved'); persistBoard(); });
app.addEventListener('click', e => {
    const target = e.target;
    if (!(target instanceof Element))
        return;
    const el = target.closest('[data-action]');
    if (!el || el.hasAttribute('disabled'))
        return;
    if (el.dataset.action === 'close-shade' && target !== el)
        return;
    action(el);
});
app.addEventListener('keydown', e => {
    if (e.key === 'Escape' && (modal || detailId)) {
        modal = null;
        detailId = null;
        updateModal();
        return;
    }
    if (e.key !== 'Enter' && e.key !== ' ')
        return;
    const target = e.target;
    if (!(target instanceof HTMLElement))
        return;
    if (target.dataset.instance) {
        e.preventDefault();
        const p = pieces.find(p => p.instanceId === Number(target.dataset.instance));
        if (p)
            openDetails(p.itemId);
    }
    if (target.dataset.item) {
        e.preventDefault();
        selectLibraryPiece(target.dataset.item);
    }
});
app.addEventListener('input', e => {
    const target = e.target;
    if (!(target instanceof HTMLInputElement))
        return;
    if (target.id === 'catalogSearch') {
        setLibrarySearch(target.value);
        return;
    }
    if (target.id === 'collectionSearch') {
        collectionSearch = target.value;
        updateModal();
        return;
    }
    if (target.id === 'historySearch') {
        historySearch = target.value;
        updateHistoryResults();
    }
});


function handleGameplayShortcut(e) {
    if (!engine || e.defaultPrevented || e.isComposing) return;
    const key = String(e.key ?? '').toLowerCase();
    const target = e.target;
    const editing = !!target && (target.isContentEditable || ['INPUT','TEXTAREA','SELECT'].includes(target.tagName));
    // Atalho do atlas de descobertas; preservar Tab nativo nos campos e controles.
    if (e.key === 'Tab' && !e.shiftKey && !e.ctrlKey && !e.metaKey && !e.altKey &&
        !editing && !['BUTTON', 'A'].includes(target?.tagName) &&
        (!modal || modal === 'collection') && !detailId) {
        e.preventDefault();
        modal = modal === 'collection' ? null : 'collection';
        updateModal();
        return;
    }
    if (modal || detailId) return;
    const input = document.querySelector('#catalogSearch');
    if ((e.ctrlKey || e.metaKey) && key === 'k' && !e.altKey) {
        e.preventDefault(); input?.focus(); return;
    }
    if (e.key === 'Enter' && target?.id === 'catalogSearch' && !e.ctrlKey && !e.metaKey && !e.altKey) {
        e.preventDefault(); addFirstSearchResult(); return;
    }
    if (e.key === 'Escape' && target?.id === 'catalogSearch') {
        e.preventDefault(); resetLibrarySearch(); return;
    }
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter' && !e.altKey && !editing) {
        e.preventDefault(); reactBoard(); return;
    }
    const altGraph = e.getModifierState?.('AltGraph') === true;
    if (editing || ((e.ctrlKey || e.metaKey || e.altKey) && !altGraph)) return;
    if (e.key === 'Delete') {
        e.preventDefault(); clearBoard(); return;
    }
    // Acentos compostos em teclado internacional: focar antes do caractere.
    if (e.key === 'Dead') { input?.focus(); return; }
    // Todas as teclas imprimíveis iniciam busca, incluindo R e C.
    if (e.key.length === 1 && input) {
        e.preventDefault();
        input.value = e.key;
        setLibrarySearch(input.value);
        input.focus();
    }
}
window.addEventListener('keydown', handleGameplayShortcut);
window.addEventListener('resize', () => { if (active)
    return; for (const p of pieces)
    clampPiece(p); updateBoardDom(); });
async function fetchJson(path) { return EMBEDDED[path.split('/').at(-1).replace('.json','')]; }
async function boot() {
    try {
        const [cards, agents, reactions, rules] = await Promise.all([fetchJson('./data/cards.json'), fetchJson('./data/agents.json'), fetchJson('./data/reactions.json'), fetchJson('./data/rules.json')]);
        const namedAgents = agents.map(a => a.id === 'volcanism'
            ? { ...a, name: 'Cristalização vulcânica', description: 'Cristalização ou devitrificação de sílica em rochas vulcânicas sob condições térmicas apropriadas.' }
            : a.id === 'reduction' ? { ...a, name: 'Redução' } : a);
        engine = createEngine(cards, namedAgents, reactions, rules);
        if (engine.diagnostics.length)
            throw new Error(engine.diagnostics.join('; '));
        pairs = buildPairCatalog(engine);
        playables = [...engine.cards, ...namedAgents.filter(a => specialAgents.has(a.id)).map(a => ({ id: a.id, name: a.name, formula: 'Agente ambiental', description: a.description, family: 'Processo geológico', kind: 'agent', color: '#80acc6' }))];
        byPlayable = new Map(playables.map(p => [p.id, p]));
        let raw = null;
        try {
            raw = JSON.parse(localStorage.getItem(SAVE_KEY) ?? 'null');
        }
        catch { /* storage denied */ }
        save = restoreSave(raw, engine);
        restoreBoard();
        restoreRecentlyUsed();
        render();
    }
    catch (error) {
        if (app)
            app.innerHTML = `<div class="fatal"><h1>Não foi possível abrir o Mineralchemy</h1><p>${esc(error instanceof Error ? error.message : String(error))}</p></div>`;
    }
}
void boot();
