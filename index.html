puts":["magnesite"],"agent":null,"equation":"MgO + CO₂ → MgCO₃","summary":"Carbonatação de óxido de magnésio.","conditions":"Disponibilidade de CO₂ e condições adequadas.","source":"https://link.springer.com/article/10.1186/s42834-022-00155-6","symbolic":false},{"id":"s-portlandite","kind":"synthesis","inputs":["lime","water"],"outputs":["portlandite"],"agent":null,"equation":"CaO + H₂O → Ca(OH)₂","summary":"Hidratação de CaO.","conditions":"Contato com água.","source":"https://www.britannica.com/science/calcium-hydroxide","symbolic":false},{"id":"s-goethite","kind":"synthesis","inputs":["hematite","water"],"outputs":["goethite"],"agent":null,"equation":"Fe₂O₃ + H₂O → 2 FeOOH","summary":"Hidratação idealizada; não ocorre automaticamente apenas por misturar sólidos.","conditions":"Montagem didática: formação real depende de processos geoquímicos.","source":"https://www.geo.fu-berlin.de/en/v/geolearning/mountain_building/weathering/weathering3/index.html","symbolic":true},{"id":"a-halite-water","kind":"alteration","inputs":["halite"],"outputs":["sodium_ion","chloride"],"agent":"water","equation":"NaCl(s) → Na⁺(aq) + Cl⁻(aq)","summary":"Dissolução da halita, sem geração de um novo mineral.","conditions":"Água como solvente.","source":"https://www.britannica.com/science/halite","symbolic":false},{"id":"a-forsterite-serp","kind":"alteration","inputs":["forsterite"],"outputs":["lizardite","brucite"],"agent":"hydrothermal","equation":"2 Mg₂SiO₄ + 3 H₂O → Mg₃Si₂O₅(OH)₄ + Mg(OH)₂","summary":"Serpentinização de forsterita idealizada, gerando lizardita e brucita.","conditions":"Sistema com água, condições apropriadas de temperatura, atividade da sílica e fluido.","source":"https://www.frontiersin.org/journals/geochemistry/articles/10.3389/fgeoc.2026.1913188/full","symbolic":false},{"id":"a-forsterite-carbon","kind":"alteration","inputs":["forsterite"],"outputs":["magnesite","quartz"],"agent":"co2","equation":"Mg₂SiO₄ + 2 CO₂ → 2 MgCO₃ + SiO₂","summary":"Carbonatação de forsterita; forma um carbonato e sílica.","conditions":"Pressão parcial de CO₂, temperatura e disponibilidade de fluido adequadas.","source":"https://link.springer.com/article/10.1186/s42834-022-00155-6","symbolic":false},{"id":"a-woll-carbon","kind":"alteration","inputs":["wollastonite"],"outputs":["calcite","quartz"],"agent":"co2","equation":"CaSiO₃ + CO₂ → CaCO₃ + SiO₂","summary":"Carbonatação de wollastonita.","conditions":"Disponibilidade de CO₂ e cinética favorável.","source":"https://link.springer.com/article/10.1186/s42834-022-00155-6","symbolic":false},{"id":"a-brucite-carbon","kind":"alteration","inputs":["brucite"],"outputs":["magnesite","water"],"agent":"co2","equation":"Mg(OH)₂ + CO₂ → MgCO₃ + H₂O","summary":"Carbonatação de brucita.","conditions":"CO₂ e condições de reação adequadas.","source":"https://link.springer.com/article/10.1186/s42834-022-00155-6","symbolic":false},{"id":"a-lizardite-carbon","kind":"alteration","inputs":["lizardite"],"outputs":["magnesite","quartz","water"],"agent":"co2","equation":"Mg₃Si₂O₅(OH)₄ + 3 CO₂ → 3 MgCO₃ + 2 SiO₂ + 2 H₂O","summary":"Carbonatação simplificada de mineral do grupo da serpentina.","conditions":"Reação idealizada; pode envolver sílica amorfa e espécies dissolvidas.","source":"https://link.springer.com/article/10.1186/s42834-022-00155-6","symbolic":false},{"id":"a-pyrite-air","kind":"alteration","inputs":["pyrite"],"outputs":["goethite","sulfate","proton"],"agent":"air","equation":"4 FeS₂ + 15 O₂ + 10 H₂O → 4 FeOOH + 8 SO₄²⁻ + 16 H⁺","summary":"Oxidação de pirita: formam-se goethita, sulfato e acidez.","conditions":"Exposição prolongada a ar e água; sequência geoquímica global.","source":"https://www.mdpi.com/2227-9717/8/4/409/htm","symbolic":false},{"id":"a-orthoclase-rain","kind":"alteration","inputs":["orthoclase"],"outputs":["kaolinite","potassium_ion","silicic_acid"],"agent":"rain","equation":"2 KAlSi₃O₈ + 2 H⁺ + 9 H₂O → Al₂Si₂O₅(OH)₄ + 2 K⁺ + 4 H₄SiO₄","summary":"Hidrólise ácida de feldspato potássico em caulinita.","conditions":"Água ácida, lixiviação e condições geoquímicas favoráveis.","source":"https://www.geo.fu-berlin.de/en/v/geolearning/mountain_building/weathering/weathering3/index.html","symbolic":false},{"id":"a-kaolinite-rain","kind":"alteration","inputs":["kaolinite"],"outputs":["gibbsite","silicic_acid"],"agent":"rain","equation":"Al₂Si₂O₅(OH)₄ + 5 H₂O → 2 Al(OH)₃ + 2 H₄SiO₄","summary":"Dessilicificação avançada de caulinita, produzindo gibbsita.","conditions":"Intemperismo intenso, com forte lixiviação de sílica.","source":"https://www.sciencedirect.com/science/article/abs/pii/S0009254111000076","symbolic":false},{"id":"a-anhydrite-water","kind":"alteration","inputs":["anhydrite"],"outputs":["gypsum"],"agent":"water","equation":"CaSO₄ + 2 H₂O → CaSO₄·2H₂O","summary":"Hidratação de anidrita formando gipsita.","conditions":"Água disponível e condições favoráveis à hidratação.","source":"https://www.britannica.com/science/gypsum","symbolic":false},{"id":"a-gypsum-heat","kind":"alteration","inputs":["gypsum"],"outputs":["anhydrite","water"],"agent":"heat","equation":"CaSO₄·2H₂O → CaSO₄ + 2 H₂O","summary":"Desidratação global da gipsita.","conditions":"Aquecimento suficiente; podem ocorrer fases intermediárias.","source":"https://www.britannica.com/science/gypsum","symbolic":false},{"id":"a-calcite-rain","kind":"alteration","inputs":["calcite"],"outputs":["calcium_ion","bicarbonate"],"agent":"rain","equation":"CaCO₃ + CO₂ + H₂O → Ca²⁺ + 2 HCO₃⁻","summary":"Dissolução de calcita em água contendo CO₂.","conditions":"Água com CO₂ dissolvido e subsaturação em calcita.","source":"https://www.geo.fu-berlin.de/en/v/geolearning/mountain_building/weathering/weathering3/index.html","symbolic":false},{"id":"a-calcite-heat","kind":"alteration","inputs":["calcite"],"outputs":["lime","co2"],"agent":"heat","equation":"CaCO₃ → CaO + CO₂","summary":"Decomposição térmica de calcita.","conditions":"Altas temperaturas e condições adequadas de pressão de CO₂.","source":"https://www.britannica.com/science/calcium-oxide","symbolic":false},{"id":"a-magnesite-heat","kind":"alteration","inputs":["magnesite"],"outputs":["periclase","co2"],"agent":"heat","equation":"MgCO₃ → MgO + CO₂","summary":"Decomposição térmica de magnesita.","conditions":"Aquecimento suficiente.","source":"https://www.britannica.com/science/magnesite","symbolic":false},{"id":"a-portlandite-co2","kind":"alteration","inputs":["portlandite"],"outputs":["calcite","water"],"agent":"co2","equation":"Ca(OH)₂ + CO₂ → CaCO₃ + H₂O","summary":"Carbonatação da portlandita.","conditions":"Contato com CO₂ atmosférico ou dissolvido.","source":"https://www.britannica.com/science/calcium-hydroxide","symbolic":false},{"id":"a-goethite-heat","kind":"alteration","inputs":["goethite"],"outputs":["hematite","water"],"agent":"heat","equation":"2 FeOOH → Fe₂O₃ + H₂O","summary":"Desidroxilação de goethita.","conditions":"Aquecimento suficiente.","source":"https://www.britannica.com/science/goethite","symbolic":false},{"id":"a-cuprite-rain","kind":"alteration","inputs":["cuprite"],"outputs":["malachite"],"agent":"rain","equation":"2 Cu₂O + 2 CO₂ + O₂ + 2 H₂O → 2 Cu₂CO₃(OH)₂","summary":"Formação simplificada de malaquita na alteração oxidante de cobre.","conditions":"Presença de água, O₂, CO₂ e atividade de espécies em solução apropriadas.","source":"https://www.britannica.com/science/malachite","symbolic":false},{"id":"a-lime-water","kind":"alteration","inputs":["lime"],"outputs":["portlandite"],"agent":"water","equation":"CaO + H₂O → Ca(OH)₂","summary":"Hidratação da cal.","conditions":"Contato com água.","source":"https://www.britannica.com/science/calcium-hydroxide","symbolic":false},{"id":"a-portlandite-heat","kind":"alteration","inputs":["portlandite"],"outputs":["lime","water"],"agent":"heat","equation":"Ca(OH)₂ → CaO + H₂O","summary":"Desidroxilação térmica da portlandita.","conditions":"Aquecimento suficiente.","source":"https://www.britannica.com/science/calcium-hydroxide","symbolic":false},{"id":"s-chalcopyrite","kind":"synthesis","inputs":["pyrite","cu"],"outputs":["chalcopyrite"],"agent":null,"equation":"FeS₂ + Cu → CuFeS₂","summary":"Incorporação composicional de cobre à pirita; a calcopirita pode se formar por substituição hidrotermal.","conditions":"Representação didática. Na natureza, o Cu é transportado em solução e há transferência de elétrons e acoplamento entre dissolução e precipitação.","source":"https://www.sciencedirect.com/science/article/pii/S0016703721000405","symbolic":true},{"id":"s-ferrosilite-direct","kind":"synthesis","inputs":["quartz","fe"],"outputs":["ferrosilite"],"agent":null,"equation":"2 Fe + 2 SiO₂ + O₂ → 2 FeSiO₃","summary":"Quartzo e ferro levam à composição ideal da ferrosilita, um ortopiroxênio.","conditions":"O₂ entra como reagente ambiental adicional, não como parte do par selecionado. Formação efetiva depende de temperatura, pressão e atividade de oxigênio. Rota didática.","source":"https://clays.org/wp-content/uploads/2026/05/CMS_Nomenclature_Glossary_April_2020_Part_2.htm","symbolic":true,"environmentalInputs":["o2"]},{"id":"s-ferrosilite","kind":"synthesis","inputs":["wustite","quartz"],"outputs":["ferrosilite"],"agent":null,"equation":"FeO + SiO₂ → FeSiO₃","summary":"Associação estequiométrica dos componentes FeO e SiO₂ para a composição ideal da ferrosilita.","conditions":"Cristalização idealizada; pressão, temperatura e fugacidade de oxigênio controlam fases e estabilidade.","source":"https://clays.org/wp-content/uploads/2026/05/CMS_Nomenclature_Glossary_April_2020_Part_2.htm","symbolic":true},{"id":"s-wustite","kind":"synthesis","inputs":["fe","hematite"],"outputs":["wustite"],"agent":null,"equation":"Fe + Fe₂O₃ → 3 FeO","summary":"Proporção composicional para produzir o óxido ferroso ideal.","conditions":"Requer condições de baixa fugacidade de oxigênio e temperatura suficiente; wüstita real é não estequiométrica (Fe₁₋ₓO).","source":"https://www.degruyterbrill.com/document/doi/10.1515/znb-2022-0071/html","symbolic":true},{"id":"s-enstatite-direct","kind":"synthesis","inputs":["quartz","mg"],"outputs":["enstatite"],"agent":null,"equation":"2 Mg + 2 SiO₂ + O₂ → 2 MgSiO₃","summary":"Síntese composicional intuitiva de um ortopiroxênio magnesiano.","conditions":"Rota didática que utiliza O₂ disponível no ambiente. Cristalização real depende das condições físico-químicas.","source":"https://clays.org/wp-content/uploads/2026/05/CMS_Nomenclature_Glossary_April_2020_Part_2.htm","symbolic":true,"environmentalInputs":["o2"]},{"id":"s-wollastonite-direct","kind":"synthesis","inputs":["quartz","ca"],"outputs":["wollastonite"],"agent":null,"equation":"2 Ca + 2 SiO₂ + O₂ → 2 CaSiO₃","summary":"Síntese composicional intuitiva de wollastonita, um piroxenoide (não um piroxênio).","conditions":"O₂ implícito do ambiente; representação didática da composição.","source":"https://clays.org/wp-content/uploads/2026/05/CMS_Nomenclature_Glossary_April_2020_Part_2.htm","symbolic":true,"environmentalInputs":["o2"]},{"id":"s-diopside","kind":"synthesis","inputs":["enstatite","wollastonite"],"outputs":["diopside"],"agent":null,"equation":"MgSiO₃ + CaSiO₃ → CaMgSi₂O₆","summary":"Composição ideal do diopsídio, um clinopiroxênio cálcico-magnesiano.","conditions":"Mistura estequiométrica de componentes, não uma reação única garantida em condições geológicas.","source":"https://clays.org/wp-content/uploads/2026/05/CMS_Nomenclature_Glossary_April_2020_Part_2.htm","symbolic":true},{"id":"s-hedenbergite","kind":"synthesis","inputs":["ferrosilite","wollastonite"],"outputs":["hedenbergite"],"agent":null,"equation":"FeSiO₃ + CaSiO₃ → CaFeSi₂O₆","summary":"Composição ideal da hedenbergita, clinopiroxênio cálcico-ferroso.","conditions":"Rota composicional idealizada, dependente das condições de estabilidade.","source":"https://clays.org/wp-content/uploads/2026/05/CMS_Nomenclature_Glossary_April_2020_Part_2.htm","symbolic":true},{"id":"s-fayalite","kind":"synthesis","inputs":["ferrosilite","wustite"],"outputs":["fayalite"],"agent":null,"equation":"FeSiO₃ + FeO → Fe₂SiO₄","summary":"Composição ideal da faialita, extremo ferroso das olivinas.","conditions":"Mistura estequiométrica idealizada; sua cristalização depende de pressão, temperatura e oxigênio.","source":"https://clays.org/wp-content/uploads/2026/05/CMS_Nomenclature_Glossary_April_2020_Part_2.htm","symbolic":true},{"id":"e-forsterite-fe","kind":"synthesis","inputs":["forsterite","fe"],"outputs":["olivine"],"agent":null,"equation":"Forsterita + Fe → Olivina (intermediária)","summary":"O ferro desloca a composição da olivina em direção ao polo rico em Fe.","conditions":"Trilha de composição didática. Reorganização catiônica real depende de trocas, balanço de matéria e equilíbrio.","source":"https://mineralogy-ima.org/docs/IMA-Nomenclature-e-Booklet-2019.pdf","symbolic":true,"mechanic":"evolution"},{"id":"e-olivine-fe","kind":"synthesis","inputs":["olivine","fe"],"outputs":["fayalite"],"agent":null,"equation":"Olivina + Fe → Faialita","summary":"Com mais ferro, a olivina chega ao membro extremo rico em Fe.","conditions":"Atalho didático para representar enriquecimento progressivo em Fe na solução sólida.","source":"https://mineralogy-ima.org/docs/IMA-Nomenclature-e-Booklet-2019.pdf","symbolic":true,"mechanic":"evolution"},{"id":"e-olivine-mg","kind":"synthesis","inputs":["olivine","mg"],"outputs":["forsterite"],"agent":null,"equation":"Olivina + Mg → Forsterita","summary":"O magnésio desloca a série da olivina em direção à forsterita.","conditions":"Atalho didático para representar mudança composicional. Não é uma equação química.","source":"https://mineralogy-ima.org/docs/IMA-Nomenclature-e-Booklet-2019.pdf","symbolic":true,"mechanic":"evolution"},{"id":"e-enstatite-ca","kind":"synthesis","inputs":["enstatite","ca"],"outputs":["diopside"],"agent":null,"equation":"2 MgSiO₃ + 2 Ca + 2 SiO₂ + O₂ → 2 CaMgSi₂O₆","summary":"Com cálcio disponível, a enstatita conduz à descoberta de um clinopiroxênio cálcico: diopsídio.","conditions":"O meio disponibiliza sílica e oxigênio. A reação é uma simplificação estequiométrica, não uma cristalização imediata.","source":"https://mineralogy-ima.org/docs/IMA-Nomenclature-e-Booklet-2019.pdf","symbolic":true,"environmentalInputs":["quartz","o2"]},{"id":"e-diopside-fe","kind":"synthesis","inputs":["diopside","fe"],"outputs":["augite"],"agent":null,"equation":"Diopsídio + Fe → Augita","summary":"O enriquecimento em ferro conduz à augita, etapa intermediária do percurso didático de clinopiroxênios.","conditions":"A augita possui uma faixa composicional complexa, não apenas um teor intermediário de Fe.","source":"https://mineralogy-ima.org/docs/IMA-Nomenclature-e-Booklet-2019.pdf","symbolic":true,"mechanic":"evolution"},{"id":"e-augite-fe","kind":"synthesis","inputs":["augite","fe"],"outputs":["hedenbergite"],"agent":null,"equation":"Augita + Fe → Hedenbergita","summary":"Mais ferro leva ao polo da hedenbergita na progressão simplificada.","conditions":"Evolução didática: a augita não é obrigatoriamente uma composição intermediária real entre esses extremos.","source":"https://mineralogy-ima.org/docs/IMA-Nomenclature-e-Booklet-2019.pdf","symbolic":true,"mechanic":"evolution"},{"id":"e-hedenbergite-mg","kind":"synthesis","inputs":["hedenbergite","mg"],"outputs":["augite"],"agent":null,"equation":"Hedenbergita + Mg → Augita","summary":"Adicionar magnésio retorna a uma composição intermediária no caminho didático.","conditions":"Trilha didática de substituição Mg–Fe.","source":"https://mineralogy-ima.org/docs/IMA-Nomenclature-e-Booklet-2019.pdf","symbolic":true,"mechanic":"evolution"},{"id":"e-augite-mg","kind":"synthesis","inputs":["augite","mg"],"outputs":["diopside"],"agent":null,"equation":"Augita + Mg → Diopsídio","summary":"Adicionar magnésio conduz em direção à composição do diopsídio.","conditions":"Trilha didática de substituição Mg–Fe.","source":"https://mineralogy-ima.org/docs/IMA-Nomenclature-e-Booklet-2019.pdf","symbolic":true,"mechanic":"evolution"},{"id":"s-brucite-water","kind":"synthesis","inputs":["periclase","water"],"outputs":["brucite"],"agent":null,"equation":"MgO + H₂O → Mg(OH)₂","summary":"A água incorpora OH à nova fase, formando brucita.","conditions":"Hidratação de um óxido de magnésio; simplificação de uma reação global.","source":"https://geo.libretexts.org/Bookshelves/Geology/Mineralogy_(Perkins_et_al.)/14%3A_Mineral_Descriptions","symbolic":false},{"id":"s-serpentine-water","kind":"synthesis","inputs":["forsterite","water"],"outputs":["lizardite","brucite"],"agent":null,"equation":"2 Mg₂SiO₄ + 3 H₂O → Mg₃Si₂O₅(OH)₄ + Mg(OH)₂","summary":"A água forma grupos OH em serpentina e brucita a partir de forsterita.","conditions":"Modelo global de serpentinização, que depende de fluidos e condições adequadas.","source":"https://publications.iodp.org/proceedings/304_305/103/103_3.htm","symbolic":false},{"id":"s-olivine-water","kind":"synthesis","inputs":["olivine","water"],"outputs":["lizardite","brucite"],"agent":null,"equation":"Olivina + Água → Serpentina + Brucita","summary":"Na trilha didática, a água transforma olivina em fases portadoras de OH.","conditions":"O produto real de olivina com Fe pode envolver magnetita e outras fases; esta é uma associação simplificada.","source":"https://publications.iodp.org/proceedings/304_305/103/103_3.htm","symbolic":true,"mechanic":"evolution"},{"id":"s-enstatite-water","kind":"synthesis","inputs":["enstatite","water"],"outputs":["lizardite","talc"],"agent":null,"equation":"6 MgSiO₃ + 3 H₂O → Mg₃Si₂O₅(OH)₄ + Mg₃Si₄O₁₀(OH)₂","summary":"A hidratação de enstatita pode formar serpentina e talco, dois minerais com OH.","conditions":"Representação de reação global hidratante em sistemas magnesianos.","source":"https://home.ifa.hawaii.edu/users/meech/a740/2004/fall/ppt/A734_Mottl110804.pdf","symbolic":false},{"id":"s-diopside-water","kind":"synthesis","inputs":["diopside","water"],"outputs":["tremolite"],"agent":null,"equation":"2 CaMgSi₂O₆ + 3 MgSiO₃ + SiO₂ + H₂O → Ca₂Mg₅Si₈O₂₂(OH)₂","summary":"Água e componentes ambientais permitem formar tremolita, um anfibólio com OH.","conditions":"Requer também magnésio e sílica do meio: não é apenas a adição direta de água ao diopsídio.","source":"https://geo.libretexts.org/Bookshelves/Geology/Mineralogy_%28Perkins_et_al.%29/14%3A_Mineral_Descriptions/14.01%3A_Silicate_Class/14.1.03%3A_Silicate_Class_-_Chain_Silicates","symbolic":true,"environmentalInputs":["enstatite","quartz"]},{"id":"s-anhydrite-water","kind":"synthesis","inputs":["anhydrite","water"],"outputs":["gypsum"],"agent":null,"equation":"CaSO₄ + 2 H₂O → CaSO₄·2H₂O","summary":"A gipsita incorpora moléculas de H₂O à estrutura, sem criar grupos OH na fórmula.","conditions":"Hidratação com água de cristalização, distinta de formação de hidroxilas.","source":"https://geo.libretexts.org/Bookshelves/Geology/Mineralogy_(Perkins_et_al.)/14%3A_Mineral_Descriptions","symbolic":false},{"id":"a-periclase-water","kind":"alteration","inputs":["periclase"],"outputs":["brucite"],"agent":"water","equation":"MgO + H₂O → Mg(OH)₂","summary":"Formação de OH em brucita.","conditions":"Hidratação.","source":"https://geo.libretexts.org/Bookshelves/Geology/Mineralogy_(Perkins_et_al.)/14%3A_Mineral_Descriptions","symbolic":false},{"id":"a-hematite-water","kind":"alteration","inputs":["hematite"],"outputs":["goethite"],"agent":"water","equation":"Fe₂O₃ + H₂O → 2 FeOOH","summary":"A fase hidratada contém hidroxila estrutural. Nesta rota, a água é usada para representar hidratação e/ou incorporação de OH estrutural.","conditions":"Modelo global de hidratação; estabilidade depende do meio.","source":"https://geo.libretexts.org/Bookshelves/Geology/Mineralogy_(Perkins_et_al.)/14%3A_Mineral_Descriptions","symbolic":false},{"id":"a-forsterite-water","kind":"alteration","inputs":["forsterite"],"outputs":["lizardite","brucite"],"agent":"water","equation":"2 Mg₂SiO₄ + 3 H₂O → Mg₃Si₂O₅(OH)₄ + Mg(OH)₂","summary":"Hidratação com formação de grupos OH.","conditions":"Modelo simplificado de serpentinização.","source":"https://publications.iodp.org/proceedings/304_305/103/103_3.htm","symbolic":false},{"id":"a-olivine-water","kind":"alteration","inputs":["olivine"],"outputs":["lizardite","brucite"],"agent":"water","equation":"Olivina + Água → Serpentina + Brucita","summary":"Água transforma a olivina em fases ricas em OH no modelo do jogo.","conditions":"O produto real depende da proporção de Fe/Mg e das condições do fluido.","source":"https://publications.iodp.org/proceedings/304_305/103/103_3.htm","symbolic":true,"mechanic":"evolution"},{"id":"a-enstatite-water","kind":"alteration","inputs":["enstatite"],"outputs":["lizardite","talc"],"agent":"water","equation":"6 MgSiO₃ + 3 H₂O → Mg₃Si₂O₅(OH)₄ + Mg₃Si₄O₁₀(OH)₂","summary":"A água adiciona grupos OH em serpentina e talco.","conditions":"Modelo global de hidratação.","source":"https://home.ifa.hawaii.edu/users/meech/a740/2004/fall/ppt/A734_Mottl110804.pdf","symbolic":false},{"id":"a-diopside-water","kind":"alteration","inputs":["diopside"],"outputs":["tremolite"],"agent":"water","equation":"2 CaMgSi₂O₆ + 3 MgSiO₃ + SiO₂ + H₂O → Ca₂Mg₅Si₈O₂₂(OH)₂","summary":"A água participa da formação de tremolita, com OH estruturais.","conditions":"Necessita também sílica e componentes de magnésio do meio.","source":"https://geo.libretexts.org/Bookshelves/Geology/Mineralogy_%28Perkins_et_al.%29/14%3A_Mineral_Descriptions/14.01%3A_Silicate_Class/14.1.03%3A_Silicate_Class_-_Chain_Silicates","symbolic":false},{"id":"a-talc-heat","kind":"alteration","inputs":["talc"],"outputs":["enstatite","quartz","water"],"agent":"heat","equation":"Mg₃Si₄O₁₀(OH)₂ → 3 MgSiO₃ + SiO₂ + H₂O","summary":"O aquecimento remove grupos OH da estrutura do talco e devolve água ao meio.","conditions":"Desidroxilação global simplificada; a sequência real de fases depende da temperatura e da pressão.","source":"https://home.ifa.hawaii.edu/users/meech/a740/2004/fall/ppt/A734_Mottl110804.pdf","symbolic":false},{"id":"a-brucite-heat","kind":"alteration","inputs":["brucite"],"outputs":["periclase","water"],"agent":"heat","equation":"Mg(OH)₂ → MgO + H₂O","summary":"Brucita libera água ao perder seus grupos hidroxila com o aquecimento.","conditions":"Desidroxilação global simplificada.","source":"https://geo.libretexts.org/Bookshelves/Geology/Mineralogy_(Perkins_et_al.)/14%3A_Mineral_Descriptions","symbolic":false},{"id":"a-tremolite-heat","kind":"alteration","inputs":["tremolite"],"outputs":["diopside","enstatite","quartz","water"],"agent":"heat","equation":"Ca₂Mg₅Si₈O₂₂(OH)₂ → 2 CaMgSi₂O₆ + 3 MgSiO₃ + SiO₂ + H₂O","summary":"O aquecimento remove OH e permite retornar a silicatos sem grupos hidroxila.","conditions":"Esquema de desidroxilação global, não uma previsão de equilíbrio metamórfico.","source":"https://geo.libretexts.org/Bookshelves/Geology/Mineralogy_%28Perkins_et_al.%29/14%3A_Mineral_Descriptions/14.01%3A_Silicate_Class/14.1.03%3A_Silicate_Class_-_Chain_Silicates","symbolic":false},{"id":"ion-oxide-proton","kind":"synthesis","inputs":["oxide","proton"],"outputs":["hydroxide"],"agent":null,"equation":"O²⁻ + H⁺ → OH⁻","summary":"Protonação de óxido gera hidróxido.","conditions":"Modelo de componentes; óxido livre não é estável em meio aquoso.","source":"https://blogs.helsinki.fi/inorganic-kvali/water-and-hydroxide-ion/","symbolic":false},{"id":"ion-water","kind":"synthesis","inputs":["hydroxide","proton"],"outputs":["water"],"agent":null,"equation":"H⁺ + OH⁻ → H₂O","summary":"Neutralização ácido-base.","conditions":"Representação simplificada; a ocorrência natural depende do ambiente.","source":"https://blogs.helsinki.fi/inorganic-kvali/water-and-hydroxide-ion/","symbolic":false},{"id":"ion-chlorine","kind":"synthesis","inputs":["chloride","chloride"],"outputs":["cl2"],"agent":null,"equation":"2 Cl⁻ → Cl₂ + 2 e⁻","summary":"Semirreação de oxidação: elétrons são omitidos das peças.","conditions":"Oxidação eletroquímica exige retirada de elétrons.","source":"https://edu.rsc.org/download?ac=527389","symbolic":true,"mechanic":"evolution"},{"id":"ion-oxygen","kind":"synthesis","inputs":["oxide","oxide"],"outputs":["o2"],"agent":null,"equation":"2 O²⁻ → O₂ + 4 e⁻","summary":"Semirreação de oxidação do íon óxido.","conditions":"Oxidação formal: O²⁻ não é livre em soluções aquosas.","source":"https://blogs.helsinki.fi/inorganic-kvali/water-and-hydroxide-ion/","symbolic":true,"mechanic":"evolution"},{"id":"ion-hydrogen","kind":"synthesis","inputs":["proton","proton"],"outputs":["h2"],"agent":null,"equation":"2 H⁺ + 2 e⁻ → H₂","summary":"Semirreação de redução que produz hidrogênio molecular.","conditions":"Os elétrons não aparecem como terceira peça.","source":"https://edu.rsc.org/download?ac=527389","symbolic":true,"mechanic":"evolution"},{"id":"ion-fluorine","kind":"synthesis","inputs":["fluoride","fluoride"],"outputs":["f2"],"agent":null,"equation":"2 F⁻ → F₂ + 2 e⁻","summary":"Semirreação de oxidação do fluoreto.","conditions":"Requer oxidante excepcionalmente forte; representação didática.","source":"https://edu.rsc.org/download?ac=527389","symbolic":true,"mechanic":"evolution"},{"id":"ion-halite","kind":"synthesis","inputs":["sodium_ion","chloride"],"outputs":["halite"],"agent":null,"equation":"Na⁺ + Cl⁻ → NaCl","summary":"Composição da halita por combinação de íons.","conditions":"Representação simplificada; a ocorrência natural depende do ambiente.","source":"https://australian.museum/learn/minerals/what-are-minerals/mineral-groups/","symbolic":false},{"id":"ion-fluorite","kind":"synthesis","inputs":["calcium_ion","fluoride"],"outputs":["fluorite"],"agent":null,"equation":"Ca²⁺ + 2 F⁻ → CaF₂","summary":"Combinação de cálcio e fluoreto.","conditions":"Representação simplificada; a ocorrência natural depende do ambiente.","source":"https://australian.museum/learn/minerals/what-are-minerals/mineral-groups/","symbolic":false},{"id":"ion-quartz","kind":"synthesis","inputs":["silicon4","oxide"],"outputs":["quartz"],"agent":null,"equation":"Si⁴⁺ + 2 O²⁻ → SiO₂","summary":"Composição formal da sílica a partir de íons.","conditions":"Íons estruturais são representações formais, não espécies aquosas livres.","source":"https://australian.museum/learn/minerals/what-are-minerals/mineral-groups/","symbolic":false},{"id":"ion-periclase","kind":"synthesis","inputs":["magnesium_ion","oxide"],"outputs":["periclase"],"agent":null,"equation":"Mg²⁺ + O²⁻ → MgO","summary":"Composição do óxido de magnésio.","conditions":"Representação simplificada; a ocorrência natural depende do ambiente.","source":"https://australian.museum/learn/minerals/what-are-minerals/mineral-groups/","symbolic":false},{"id":"ion-wustite","kind":"synthesis","inputs":["iron2","oxide"],"outputs":["wustite"],"agent":null,"equation":"Fe²⁺ + O²⁻ → FeO","summary":"Composição da wüstita.","conditions":"Representação simplificada; a ocorrência natural depende do ambiente.","source":"https://australian.museum/learn/minerals/what-are-minerals/mineral-groups/","symbolic":false},{"id":"ion-lime","kind":"synthesis","inputs":["calcium_ion","oxide"],"outputs":["lime"],"agent":null,"equation":"Ca²⁺ + O²⁻ → CaO","summary":"Composição da cal.","conditions":"Representação simplificada; a ocorrência natural depende do ambiente.","source":"https://australian.museum/learn/minerals/what-are-minerals/mineral-groups/","symbolic":false},{"id":"ion-hematite","kind":"synthesis","inputs":["iron3","oxide"],"outputs":["hematite"],"agent":null,"equation":"2 Fe³⁺ + 3 O²⁻ → Fe₂O₃","summary":"Composição da hematita.","conditions":"Representação simplificada; a ocorrência natural depende do ambiente.","source":"https://australian.museum/learn/minerals/what-are-minerals/mineral-groups/","symbolic":false},{"id":"ion-corundum","kind":"synthesis","inputs":["aluminium3","oxide"],"outputs":["corundum"],"agent":null,"equation":"2 Al³⁺ + 3 O²⁻ → Al₂O₃","summary":"Composição do coríndon.","conditions":"Representação simplificada; a ocorrência natural depende do ambiente.","source":"https://australian.museum/learn/minerals/what-are-minerals/mineral-groups/","symbolic":false},{"id":"ion-tenorite","kind":"synthesis","inputs":["copper2","oxide"],"outputs":["tenorite"],"agent":null,"equation":"Cu²⁺ + O²⁻ → CuO","summary":"Composição da tenorita.","conditions":"Representação simplificada; a ocorrência natural depende do ambiente.","source":"https://australian.museum/learn/minerals/what-are-minerals/mineral-groups/","symbolic":false},{"id":"ion-hydroxide-brucite","kind":"synthesis","inputs":["magnesium_ion","hydroxide"],"outputs":["brucite"],"agent":null,"equation":"Mg²⁺ + 2 OH⁻ → Mg(OH)₂","summary":"Formação composicional de brucita.","conditions":"Representação simplificada; a ocorrência natural depende do ambiente.","source":"https://blogs.helsinki.fi/inorganic-kvali/water-and-hydroxide-ion/","symbolic":false},{"id":"ion-hydroxide-portlandite","kind":"synthesis","inputs":["calcium_ion","hydroxide"],"outputs":["portlandite"],"agent":null,"equation":"Ca²⁺ + 2 OH⁻ → Ca(OH)₂","summary":"Formação composicional de portlandita.","conditions":"Representação simplificada; a ocorrência natural depende do ambiente.","source":"https://blogs.helsinki.fi/inorganic-kvali/water-and-hydroxide-ion/","symbolic":false},{"id":"ion-hydroxide-gibbsite","kind":"synthesis","inputs":["aluminium3","hydroxide"],"outputs":["gibbsite"],"agent":null,"equation":"Al³⁺ + 3 OH⁻ → Al(OH)₃","summary":"Formação composicional de gibbsita.","conditions":"Representação simplificada; a ocorrência natural depende do ambiente.","source":"https://blogs.helsinki.fi/inorganic-kvali/water-and-hydroxide-ion/","symbolic":false},{"id":"ion-hydroxide-goethite","kind":"synthesis","inputs":["iron3","hydroxide"],"outputs":["goethite"],"agent":null,"equation":"Fe³⁺ + 3 OH⁻ → FeOOH + H₂O","summary":"Precipitação simplificada de goethita.","conditions":"Representação simplificada; a ocorrência natural depende do ambiente.","source":"https://blogs.helsinki.fi/inorganic-kvali/water-and-hydroxide-ion/","symbolic":false},{"id":"ion-siderite","kind":"synthesis","inputs":["iron2","carbonate"],"outputs":["siderite"],"agent":null,"equation":"Fe²⁺ + CO₃²⁻ → FeCO₃","summary":"Formação composicional da siderita.","conditions":"Representação simplificada; a ocorrência natural depende do ambiente.","source":"https://australian.museum/learn/minerals/what-are-minerals/mineral-groups/","symbolic":false},{"id":"ion-calcite","kind":"synthesis","inputs":["calcium_ion","carbonate"],"outputs":["calcite"],"agent":null,"equation":"Ca²⁺ + CO₃²⁻ → CaCO₃","summary":"Formação composicional da calcita.","conditions":"Representação simplificada; a ocorrência natural depende do ambiente.","source":"https://australian.museum/learn/minerals/what-are-minerals/mineral-groups/","symbolic":false},{"id":"ion-magnesite","kind":"synthesis","inputs":["magnesium_ion","carbonate"],"outputs":["magnesite"],"agent":null,"equation":"Mg²⁺ + CO₃²⁻ → MgCO₃","summary":"Formação composicional da magnesita.","conditions":"Representação simplificada; a ocorrência natural depende do ambiente.","source":"https://australian.museum/learn/minerals/what-are-minerals/mineral-groups/","symbolic":false},{"id":"ion-troilite","kind":"synthesis","inputs":["iron2","sulfide"],"outputs":["troilite"],"agent":null,"equation":"Fe²⁺ + S²⁻ → FeS","summary":"Formação composicional da troilita.","conditions":"Representação simplificada; a ocorrência natural depende do ambiente.","source":"https://australian.museum/learn/minerals/what-are-minerals/mineral-groups/","symbolic":false},{"id":"ion-sphalerite","kind":"synthesis","inputs":["zinc2","sulfide"],"outputs":["sphalerite"],"agent":null,"equation":"Zn²⁺ + S²⁻ → ZnS","summary":"Formação composicional da esfalerita.","conditions":"Representação simplificada; a ocorrência natural depende do ambiente.","source":"https://australian.museum/learn/minerals/what-are-minerals/mineral-groups/","symbolic":false},{"id":"ion-covellite","kind":"synthesis","inputs":["copper2","sulfide"],"outputs":["covellite"],"agent":n function updateBoardDom() {

function addPiece(itemId) {

function updateModal() { const root = document.querySelector('#modalRoot'); if (root)

            updateModal();
            break;
        case 'history':
            modal = 'history';
            detailId = null;
            updateModal();
            break;
        case 'reset':

            updateModal();

app.addEventListener('pointerdown', e => {
